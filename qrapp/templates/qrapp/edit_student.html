{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>
    <link rel="stylesheet" href="{% static 'qrapp/css/edit_student.css' %}">
</head>
<body>
    <div class="form-container">
        <h2>Edit Student</h2>
        <form method="POST">
            {% csrf_token %}
            <label>Name:</label>
            <input type="text" name="name" value="{{ student.name }}" required>

            <label>Sex:</label>
            <select name="sex" required>
                <option value="Male" {% if student.sex == "Male" %}selected{% endif %}>Male</option>
                <option value="Female" {% if student.sex == "Female" %}selected{% endif %}>Female</option>
            </select>

            <label>College:</label>
            <select name="college" required>
                {% for code, name in college_choices %}
                    <option value="{{ code }}" {% if student.college_code == code %}selected{% endif %}>
                        {{ name }}
                    </option>
                {% endfor %}
            </select>

            <label>Program:</label>
            <input type="text" name="program" value="{{ student.program_code }}" required>

            <label>Year:</label>
            <input type="number" name="year" value="{{ student.year }}" required>

            <label>Major:</label>
            <input type="text" name="major" value="{{ student.major_name }}" placeholder="Leave blank if none">

            <button type="submit" class="btn btn-save">Save Changes</button>
            <a href="{% url 'admin_dashboard' %}" class="btn btn-cancel">Cancel</a>
        </form>
    </div>

    {% include 'qrapp/partials/notifications.html' %}
</body>
</html>
