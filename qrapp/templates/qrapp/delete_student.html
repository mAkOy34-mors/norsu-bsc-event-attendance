{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Student - Confirm Password</title>
    <link rel="stylesheet" href="{% static 'qrapp/css/delete_student.css' %}">
</head>
<body>
    <div class="confirm-box">
        <h2>Delete Student</h2>
        <p>Are you sure you want to delete <strong>{{ student.name }}</strong>?</p>

        <form method="POST" id="deleteForm">
            {% csrf_token %}
            <input type="password" class="password-input" id="adminPassword"
                   name="adminPassword" placeholder="Enter your account password" required>
            <div class="error-message" id="passwordError"{% if messages %}{% for message in messages %}{% if message.tags == 'error' %} data-error-text="{{ message }}"{% endif %}{% endfor %}{% endif %}>
                Incorrect password. Please try again.
            </div>

            <div>
                <button type="submit" class="btn btn-delete">Confirm Delete</button>
                <a href="{% url 'admin_dashboard' %}" class="btn btn-cancel">Cancel</a>
            </div>
        </form>
    </div>

    {% include 'qrapp/partials/notifications.html' %}
    <script src="{% static 'qrapp/js/delete_student.js' %}" defer></script>
</body>
</html>
